<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD" />
      <stop offset="50%" stop-color="#F3DFA2" />
      <stop offset="100%" stop-color="#D4B86A" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242426" />
      <stop offset="100%" stop-color="#141415" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Medallion -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="1.5" />
  
  <!-- Subtle Inner Hairline -->
  <rect x="6" y="6" width="52" height="52" rx="10" stroke="url(#goldGrad)" stroke-opacity="0.25" stroke-width="0.75" />

  <!-- Architectural Cardinal Accent Points -->
  <circle cx="32" cy="7" r="1" fill="#F3DFA2" />
  <circle cx="32" cy="57" r="1" fill="#F3DFA2" />
  <circle cx="7" cy="32" r="1" fill="#F3DFA2" />
  <circle cx="57" cy="32" r="1" fill="#F3DFA2" />

  <!-- Monogram CW: Interlocking Architectural Luxury Letterforms -->
  <g transform="translate(13, 16)" filter="url(#glow)">
    <!-- Letter C: Elegant tapered crescent -->
    <path 
      d="M23 7.5 C20.5 4.5 16 3.5 12 5 C6.5 7.2 3.5 12.8 4 18.5 C4.5 24.5 8.5 29 14.5 29 C18.5 29 22 26.5 23.5 23.5" 
      stroke="url(#goldGrad)" 
      stroke-width="2.5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      fill="none" 
    />
    <!-- Letter C finial serif -->
    <circle cx="23" cy="7.5" r="1.2" fill="#FDF0CD" />

    <!-- Letter W: Geometric architectural struts interlocking behind/through C -->
    <path 
      d="M13 11 L18.5 27 L24 13 L29.5 27 L35 11" 
      stroke="url(#goldGrad)" 
      stroke-width="2.2" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      fill="none" 
    />
    <!-- W serifs / top terminals -->
    <path d="M11.5 11 H14.5" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />
    <path d="M33.5 11 H36.5" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linecap="round" />

    <!-- Central Diamond Apex Jewel -->
    <path 
      d="M24 8.5 L25.5 10.5 L24 12.5 L22.5 10.5 Z" 
      fill="#FDF0CD" 
    />
  </g>
</svg>
